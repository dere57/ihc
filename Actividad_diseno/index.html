<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josema Tienda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado: nombre de la tienda (amarillo) y carrito arriba a la derecha, como en el boceto -->
  <header class="encabezado">
    <h1 class="logo">josema<br>tienda</h1>
    <button id="btn-carrito" class="btn-carrito" aria-label="Abrir carrito de compras">
      <span class="icono-carrito" aria-hidden="true">🛒</span>
      <span class="etiqueta-carrito">Carrito</span>
      <span id="contador" class="contador">0</span>
    </button>
  </header>

  <main class="contenedor">

    <!-- Filtro por categoría -->
    <section class="filtros" aria-label="Filtrar productos por categoría">
      <span class="filtros-titulo">Categoría:</span>
      <button class="btn-filtro activo" data-categoria="todos">Todos</button>
      <button class="btn-filtro" data-categoria="dulces">Dulces</button>
      <button class="btn-filtro" data-categoria="chocolates">Chocolates</button>
    </section>

    <p id="resumen" class="resumen" aria-live="polite"></p>

    <!-- Catálogo: se llena desde script.js -->
    <section id="catalogo" class="catalogo" aria-label="Catálogo de productos"></section>

  </main>

  <!-- Panel del carrito (simulado) -->
  <div id="fondo" class="fondo" hidden></div>
  <aside id="panel-carrito" class="panel-carrito" aria-label="Carrito de compras" hidden>
    <div class="panel-encabezado">
      <h2>Tu carrito</h2>
      <button id="cerrar-carrito" class="btn-cerrar" aria-label="Cerrar carrito">✕</button>
    </div>
    <ul id="lista-carrito" class="lista-carrito"></ul>
    <div class="panel-pie">
      <p class="total">Total: <strong id="total">$0</strong></p>
      <button id="vaciar" class="btn-secundario">Vaciar carrito</button>
    </div>
  </aside>

  <!-- Mensaje de retroalimentación -->
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
